name: Build APK

# Tự động build APK Android, đặt tên bad-habit-<version>.apk.
# - Push lên dev/main, pull request, hoặc bấm chạy tay: APK nằm trong mục Artifacts.
# - Đẩy tag dạng v1.2.0: version lấy từ tag và APK được đính kèm vào GitHub Release.
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # để tạo Release khi đẩy tag

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Xác định phiên bản
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # "version: 1.0.0+1" trong pubspec.yaml -> "1.0.0"
            VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          fi
          echo "Phiên bản: $VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=bad-habit-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Nếu repo có secrets khóa ký thì dùng; không có thì Gradle tự ký bằng khóa debug.
      - name: Chuẩn bị khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64, APK được ký bằng khóa debug (không cài đè được giữa các lần build)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Đặt tên APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.file }}"
          ls -lh "${{ steps.version.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bad-habit-${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.file }}
          if-no-files-found: error

      - name: Đính kèm vào Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.file }}
          generate_release_notes: true
